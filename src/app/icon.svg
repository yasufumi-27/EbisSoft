<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="エビスソフト">
  <!--
    小サイズ用のマーク（ブラウザのタブ・SNSアイコン）。
    ロゴ本体は "EBISU SOFT" のワードマークだが、16〜32px では5文字が潰れるため
    頭2文字 "EB" に縮めている。Eの中央バーだけをシアンにして、
    どのサイズでもブランドカラーが残るようにしている。
    3D・グラデーション・影は使わない（フラット統一）。
  -->
  <rect width="64" height="64" rx="14" fill="#0f2e5f" />
  <!-- E：横棒3本。中央だけシアン -->
  <g fill="#ffffff">
    <rect x="9" y="17" width="6" height="30" />
    <rect x="9" y="17" width="16" height="6" />
    <rect x="9" y="41" width="16" height="6" />
  </g>
  <rect x="9" y="29" width="13" height="6" fill="#22d3ee" />
  <!-- B：同じ太さ・同じ高さで揃える -->
  <g fill="none" stroke="#ffffff" stroke-width="6">
    <path d="M34 17V47" />
    <path d="M34 20h11.5a6 6 0 0 1 0 12H34" />
    <path d="M34 32h13a6 6 0 0 1 0 12H34" />
  </g>
</svg>
