# さくらのレンタルサーバ（本番: https://ebisusoft.sakura.ne.jp）への公開。
#
# 静的書き出し（out/）を FTPS でアップロードする。
# 認証情報は GitHub の Settings > Secrets and variables > Actions に登録すること：
#   SAKURA_FTP_HOST     … ebisusoft.sakura.ne.jp
#   SAKURA_FTP_USER     … ebisusoft
#   SAKURA_FTP_PASSWORD … サーバーパスワード（さくらの会員パスワードとは別物）
#   SAKURA_FTP_DIR      … /www
#     ↑ FTPはchrootされていて、ログイン直後の / が既に /home/ebisusoft。
#       /home/ebisusoft/www と書くと /home/ebisusoft/home/ebisusoft/www が
#       新規作成されてそこに置かれてしまう（転送は成功するので気づきにくい）。
#
# ------------------------------------------------------------------
# 【重要】このワークフローは現状**使えない**（2026-08-03 実測）。
#
# さくらの「国外IPアドレスフィルタ」が国外からのFTP接続を遮断しており、
# GitHub Actions の runner（米国IP）は接続すら確立できない。
# lftp が `mirror: Fatal error: max-retries exceeded` で落ちる。
# （タイムアウトを指定していなかった初回は、そのまま3時間ハングした）
#
# → **通常は日本国内のローカルから `npm run deploy:sakura` を使うこと。**
#   ビルド・アップロード・疎通確認まで一括で行う（scripts/deploy-sakura.sh）。
#
# このワークフローは、将来さくら側で国外IPフィルタを解除した場合に備えて残してある。
# 解除したら push トリガーのコメントを外せばそのまま動く（Secretsは登録済み）。
# ただしFTPが全世界から到達可能になる点は理解したうえで判断すること。
# ------------------------------------------------------------------
name: Deploy to Sakura

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: sakura
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # FTPが詰まったまま何時間も回り続けるのを防ぐ（実測では転送は数分で終わる）。
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:sakura

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload to Sakura via FTPS
        env:
          HOST: ${{ secrets.SAKURA_FTP_HOST }}
          USER: ${{ secrets.SAKURA_FTP_USER }}
          PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
          REMOTE_DIR: ${{ secrets.SAKURA_FTP_DIR }}
        run: |
          set -eu
          # --reverse: ローカル→リモート、--delete: 消えたファイルはリモートからも削除
          # .htaccess も対象にするため --exclude はディレクトリのみに限定する
          #
          # ※ タイムアウト類は必ず指定すること。無指定だと接続が詰まったときに
          #   lftp が延々とリトライし続け、ジョブが3時間以上ハングした実績がある。
          # ※ さくらは同時接続数に制限があるため --parallel は控えめに。
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:timeout 15;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            set net:persist-retries 3;
            set cmd:fail-exit true;
            open -u \"$USER\",\"$PASSWORD\" \"$HOST\";
            mirror --reverse --delete --verbose --parallel=2 \
              --exclude-glob .git/ \
              out/ \"$REMOTE_DIR\";
          "

      - name: Verify
        run: |
          set -eu
          for p in "" ai web embedded company contact faq request privacy demo demo/3dcg \
                   sitemap.xml robots.txt llms.txt; do
            curl -sSf -o /dev/null -w "%{http_code}  /$p\n" "https://ebisusoft.sakura.ne.jp/$p"
          done
          # 事前圧縮（.br）が配信されているか。無ければ Content-Encoding が付かない。
          echo -n "brotli: "
          curl -sS -o /dev/null -D- -H 'Accept-Encoding: br' https://ebisusoft.sakura.ne.jp/ \
            | grep -i '^content-encoding' || echo "（未適用）"
